<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/generate.css">
    <link rel="icon" type="image/png" href="../img/logo_whitebg.png">
    <title>Generate | MyUniSched</title>
</head>
<body>
    <div class="main_bg"></div>

    <nav class="navbar">
        <a class="nav_logo" href="../index.html">
            <img src="../img/logo.png" alt="" class="nav_logo_img">
        </a>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="./generate.html">Generate</a></li>
            <li><a href="./myEntities.html">My Entities</a></li>
            <li><a href="./mySchedule.html">My Schedule</a></li>

        <div class="profile_menu">
            <img src="../img/pfp_icon.png" class="profile_img" alt="">

            <div class="dropdown">
                <a href="#" id="openLogIn">Log In</a>
                <a href="#" id="openSignUp">Sign up</a>
            </div>
        </div>
    </nav>

    <section class="generate">
        <div class="generate_container">
            <h1 class="generate_title">Generate Timetable</h1>
            <p class="generate_description">"Best Timetable. No Hassle"</p>

            <div class="generate_controls">
                <button class="generate_btn" id="generateBtn">
                    <span>Generate Timetable</span>
                </button>
                <button class="reset_btn" id="resetBtn">
                    <span>Reset</span>
                </button>
            </div>

            <div class="timetable_status" id="timetableStatus"></div>

            <div class="timetable_wrapper">
                <div class="timetable_container" id="timetableContainer">
                    <p class="no_timetable">Click "Generate Timetable" to create your schedule</p>
                </div>
            </div>
        </div>
    </section>

    <footer>  
        <div class="footer_container">
            <div class="footer_head">
                <img src="../img/logo.png" class="nav_logo footer_logo" alt="">
                <div class="footer_title">MyUniSched.</div>
